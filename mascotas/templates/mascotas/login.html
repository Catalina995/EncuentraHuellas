{% extends 'mascotas/base.html' %}

{% block content %}

<section class="login-seccion">
    <div class="login-contenedor">

        <h1>Iniciar sesión</h1>
        <p>Ingresa a tu cuenta para publicar y administrar tus avisos.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Iniciar sesión
            </button>
        </form>

    </div>
</section>

{% endblock %}
